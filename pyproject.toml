[project]
name = "sqlite-memory-mcp"
version = "3.13.3"
description = "SQLite-backed MCP Memory Server with hybrid search, Intelligence v2, causal event ledger, premium runtime boundary, WAL concurrency, cross-machine bridge sync, and a deterministic zero-paste debate/v1 protocol with typed server invariants"
requires-python = ">=3.11"
dependencies = ["fastmcp>=2.0.0"]
license = "MIT"
authors = [{name = "rmanov"}]
readme = "README.md"

[project.optional-dependencies]
gui = ["PyQt6>=6.5"]
dev = ["pytest>=7.0"]
speed = ["orjson>=3.9.0"]
vector = ["sqlite-vec>=0.1.6", "sentence-transformers>=3.0.0"]
community = ["igraph>=0.11", "leidenalg>=0.10"]

[project.scripts]
sqlite-memory-mcp = "server:main"
sqlite-memory-core = "server:main"
sqlite-memory-session = "session_server:main"
sqlite-memory-tasks = "task_server:main"
sqlite-memory-bridge = "bridge_server:main"
sqlite-memory-collab = "collab_server:main"
sqlite-memory-entity = "entity_server:main"
sqlite-memory-intel = "intel_server:main"
sqlite-memory-unified = "unified_server:main"
sqlite-memory-n8n = "n8n_server:main"
sqlite-memory-doctor = "install_doctor:main"
sqlite-memory-debate-ops = "debate_ops:main"
sqlite-memory-demo = "demo_flow:main"
task-tray = "task_tray:main"
memory-digest = "daily_digest:main"

[tool.ruff.lint]
# Ruff 0.16 expanded its implicit default from 59 to 413 rules. Keep the
# repository's established lint contract explicit so CI does not change
# behavior when the runner installs a newer Ruff release.
select = ["E4", "E7", "E9", "F"]

[tool.setuptools]
py-modules = [
    "advanced_context",
    "auto_archive",
    "bridge_merge_driver",
    "bridge_peer_sync",
    "bridge_server",
    "bridge_sync_worker",
    "claim_confidence",
    "claim_graph",
    "collab_server",
    "control_plane_shadow",
    "context_packer",
    "daily_digest",
    "db_utils",
    "debate",
    "debate_list_widget",
    "debate_ops",
    "debate_ops_windows",
    "debate_protocol_v1",
    "debate_prompt_context",
    "debate_read_dao",
    "debate_retrieval",
    "debate_worker_server",
    "debate_wake_signal",
    "enrichment_constants",
    "entity_server",
    "fastmcp_compat",
    "impact_graph",
    "import_notion",
    "install_doctor",
    "intel_server",
    "intelligence_v2",
    "lazy_enrichment",
    "lazy_verification",
    "link_suggestions",
    "memory_audit",
    "memory_thread_clustering",
    "n8n_server",
    "obsidian_publish",
    "overdue_bump",
    "premium_contract",
    "premium_runtime",
    "prediction_calibration",
    "premium_task_tray",
    "recurring_tasks",
    "reflection",
    "reflection_apply",
    "reflection_dao",
    "retrieval_contract",
    "runtime_parity",
    "schema",
    "demo_flow",
    "server",
    "session_server",
    "smart_retrieval",
    "source_reliability",
    "surface_contract",
    "task_report",
    "task_search",
    "task_server",
    "task_status_cas",
    "task_tray",
    "tray_dialogs",
    "tray_filters",
    "tray_sync",
    "trust_boundary",
    "unified_server",
    "vec_search",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "hooks", "hooks.*",
    "templates", "templates.*",
    "tools", "tools.*",
]
namespaces = true

[tool.setuptools.package-data]
"templates.private_premium_repo" = [".gitignore", "README.md", "pyproject.toml"]

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"
